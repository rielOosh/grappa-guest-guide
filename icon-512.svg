  <text x="256" y="464" text-anchor="middle" font-family="'Inter', 'Heebo', sans-serif" font-size="24" font-weight="500" letter-spacing="6" fill="#E2E4A8" opacity="0.9">KIBBUTZ YAHEL</text>
