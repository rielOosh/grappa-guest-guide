  </g>
  <!-- Calligraphic Serif Wordmark -->
  <text x="96" y="158" text-anchor="middle" font-family="'Cormorant Garamond', 'Georgia', 'Times New Roman', serif" font-size="38" font-weight="600" letter-spacing="1.5" fill="#FFFFFF">GrappA</text>
</svg>